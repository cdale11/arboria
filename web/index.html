<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arboria</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #243126;
        font-family: ui-rounded, "Avenir Next", system-ui, sans-serif;
        line-height: 1.45;
        background: #f4efe4;
      }

      main {
        max-width: 72rem;
        margin: 0 auto;
        padding: 1rem;
      }

      h1 {
        margin-bottom: 0.25rem;
        color: #193d2a;
        letter-spacing: -0.03em;
      }

      h2 {
        margin-top: 0;
        color: #315d43;
      }

      button,
      input,
      select,
      textarea {
        min-height: 44px;
        max-width: 100%;
        margin-block: 0.125rem;
        font: inherit;
      }

      button {
        padding: 0.45rem 0.7rem;
      }

      section p,
      section {
        overflow-wrap: anywhere;
      }

      [data-action="nursery-scene"] {
        display: block;
        width: 100%;
        min-height: 14rem;
        margin: 1rem 0;
        border: 1px solid #d0c4ae;
        border-radius: 0.75rem;
        background: linear-gradient(#d9edf5, #f7f1dc 72%, #b18a55 72%);
      }

      [data-action="status"] {
        margin: 0.25rem 0 1rem;
        color: #526757;
      }

      .nursery-dashboard {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.65rem;
        margin: 1rem 0;
      }

      .metric-card {
        display: grid;
        gap: 0.2rem;
        min-height: 5.5rem;
        padding: 0.8rem;
        border: 1px solid #d8ccb9;
        border-radius: 0.8rem;
        background: #fffaf1;
        box-shadow: 0 0.25rem 1rem rgb(68 52 31 / 8%);
      }

      .metric-card span {
        color: #647467;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .metric-card strong {
        color: #193d2a;
        font-size: 1.15rem;
      }

      .scene-frame {
        margin: 1.25rem 0;
        padding: 1rem;
        border: 1px solid #d8ccb9;
        border-radius: 1rem;
        background: #fffaf1;
        box-shadow: 0 0.5rem 1.5rem rgb(68 52 31 / 10%);
      }

      .scene-frame h2 {
        margin-bottom: 0.5rem;
      }

      .control-section {
        margin: 1rem 0;
        padding: 1rem;
        border: 1px solid #ded3c2;
        border-radius: 0.85rem;
        background: rgb(255 250 241 / 78%);
      }

      .care-section {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr));
        gap: 0.75rem;
      }

      .care-section h2 {
        grid-column: 1 / -1;
        margin-bottom: 0;
      }

      .plant-card {
        margin: 0;
        padding: 0.75rem;
        border: 1px solid #e2d6c4;
        border-radius: 0.7rem;
        background: #fff;
      }

      .plant-card h3 {
        margin: 0;
        color: #315d43;
      }

      .plant-card p {
        margin: 0.5rem 0;
      }

      .plant-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .plant-card button {
        margin-top: 0.35rem;
      }

      .plant-card button[data-action="sell"] {
        color: #783c2e;
      }

      .saves-section textarea {
        width: min(100%, 42rem);
        vertical-align: top;
      }

      .companion-section {
        border-color: #b8cdb9;
        background: #eef6ed;
      }

      .app-navigation {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin: 0.75rem 0;
      }

      .app-navigation button[aria-current="page"] {
        color: #fff;
        border-color: #193d2a;
        background: #1d5b43;
      }

      .plant-picker {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        grid-column: 1 / -1;
      }

      .plant-picker h3 {
        flex-basis: 100%;
        margin: 0;
      }

      .scene-camera-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin-top: 0.5rem;
      }

      @media (max-width: 420px) {
        main {
          padding: 0.75rem;
        }

        button,
        input,
        select,
        textarea {
          width: 100%;
        }

        .care-section {
          grid-template-columns: 1fr;
        }

        .nursery-dashboard {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .plant-actions {
          display: grid;
          grid-template-columns: 1fr;
        }

        .app-navigation {
          position: sticky;
          top: 0;
          z-index: 3;
          margin-inline: -0.75rem;
          padding: 0.5rem 0.75rem;
          background: rgb(244 239 228 / 94%);
          backdrop-filter: blur(0.5rem);
        }

        .app-navigation button {
          flex: 1 1 calc(33% - 0.35rem);
          white-space: nowrap;
        }

        .scene-frame {
          margin-bottom: 18rem;
        }

        .control-section[data-section="nursery"] {
          position: fixed;
          right: 0.65rem;
          bottom: 0.65rem;
          left: 0.65rem;
          z-index: 2;
          max-height: min(46vh, 24rem);
          margin: 0;
          overflow: auto;
          border-color: #9ab7a1;
          border-radius: 1.1rem;
          box-shadow: 0 0.75rem 2rem rgb(36 49 38 / 22%);
        }

        .control-section[data-section="nursery"]::before {
          display: block;
          width: 2.5rem;
          height: 0.25rem;
          margin: -0.35rem auto 0.65rem;
          border-radius: 1rem;
          background: #9ab7a1;
          content: "";
        }

        .care-section {
          display: block;
        }

        .plant-card {
          margin-bottom: 0.65rem;
        }

        .plant-picker {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .plant-picker button {
          width: 100%;
          overflow: hidden;
          text-overflow: ellipsis;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
