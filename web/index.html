<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arboria</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        line-height: 1.45;
      }

      main {
        max-width: 72rem;
        margin: 0 auto;
        padding: 1rem;
      }

      button,
      input,
      select,
      textarea {
        min-height: 44px;
        max-width: 100%;
        margin-block: 0.125rem;
        font: inherit;
      }

      button {
        padding: 0.45rem 0.7rem;
      }

      section p,
      section {
        overflow-wrap: anywhere;
      }

      [data-action="nursery-scene"] {
        display: block;
        width: 100%;
        min-height: 14rem;
        margin: 1rem 0;
        border: 1px solid #d0c4ae;
        border-radius: 0.75rem;
        background: linear-gradient(#d9edf5, #f7f1dc 72%, #b18a55 72%);
      }

      @media (max-width: 420px) {
        main {
          padding: 0.75rem;
        }

        button,
        input,
        select,
        textarea {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
